<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ViceCover Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23e8365d'/%3E%3Ctext x='16' y='24' font-size='20' font-family='Arial' font-weight='900' fill='white' text-anchor='middle'%3EV%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>ViceCover Studio</h1>
    <p class="tagline">Build a GTA-style multi-panel cover from your photos.</p>

    <div class="group">
      <span class="group-label">Photos</span>
      <label class="file-pick">Add photos <input id="photo" type="file" accept="image/*" multiple></label>
      <div id="tray" class="tray" aria-label="Photo tray"></div>
      <p class="hint">Tip: drop files anywhere on the window, or paste from the clipboard. Click a panel on the cover, then a tray item, to place it.</p>
    </div>

    <div class="group">
      <span class="group-label">Layout</span>
      <div id="layouts" class="chip-row"></div>
    </div>

    <div class="group">
      <span class="group-label">Selected panel</span>
      <p id="panel-name" class="panel-name">Panel 1</p>
      <label>Focus X <input id="focus-x" type="range" min="0" max="100" value="50"></label>
      <label>Focus Y <input id="focus-y" type="range" min="0" max="100" value="50"></label>
      <label>Zoom <input id="zoom" type="range" min="100" max="300" value="100"></label>
      <button id="recenter" type="button">Re-center panel</button>
    </div>

    <div class="group">
      <span class="group-label">Colour grade</span>
      <div id="grades" class="chip-row"></div>
      <label>Grade strength <input id="grade-strength" type="range" min="0" max="100" value="85"></label>
      <label class="check">Vignette <input id="vignette" type="checkbox" checked></label>
    </div>

    <div class="group">
      <span class="group-label">Lettering</span>
      <label>Title <input id="title" type="text" maxlength="30" value="VICE COVER"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="40" value="Tales from the Coast"></label>
      <label>Caption bar <input id="caption" type="text" maxlength="48" value="One city. Every story."></label>
      <label>Badge <input id="badge" type="text" maxlength="18" value="NEW"></label>
      <label class="check">Platform strip <input id="strip-on" type="checkbox" checked></label>
      <label>Strip text <input id="strip-text" type="text" maxlength="40" value="VICE CITY EDITION"></label>
    </div>

    <div class="group">
      <span class="group-label">Export</span>
      <div id="sizes" class="chip-row"></div>
      <button id="export" type="button">Export PNG</button>
      <p id="status" role="status"></p>
    </div>
  </section>
  <section class="stage">
    <canvas id="cover" width="1080" height="1350" aria-label="The cover being built"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
